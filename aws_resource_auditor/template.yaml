AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AWS Resource Auditor and Governance Reporter

Parameters:
  AuditRegions:
    Type: String
    Default: ap-south-1
  RequiredTags:
    Type: String
    Default: Owner,Environment,Project
  SnapshotAgeDays:
    Type: Number
    Default: 90
  StoppedInstanceDays:
    Type: Number
    Default: 14
  ScheduleExpression:
    Type: String
    Default: rate(1 day)

Resources:
  AuditReportsBucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration:
        Status: Enabled

  ResourceAuditorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: aws-resource-auditor
      Runtime: python3.12
      CodeUri: .
      Handler: src.auditor.lambda_handler.handler
      Timeout: 300
      MemorySize: 256
      Environment:
        Variables:
          AUDIT_REGIONS: !Ref AuditRegions
          AUDIT_BUCKET: !Ref AuditReportsBucket
          SNAPSHOT_AGE_DAYS: !Ref SnapshotAgeDays
          STOPPED_INSTANCE_DAYS: !Ref StoppedInstanceDays
          REQUIRED_TAGS: !Ref RequiredTags
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ec2:DescribeInstances
                - ec2:DescribeVolumes
                - ec2:DescribeSnapshots
                - s3:ListAllMyBuckets
                - s3:GetBucketLocation
                - s3:GetBucketPolicyStatus
                - s3:GetBucketTagging
                - lambda:ListFunctions
                - lambda:ListTags
                - rds:DescribeDBInstances
                - rds:ListTagsForResource
              Resource: '*'
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub '${AuditReportsBucket.Arn}/*'
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            Schedule: !Ref ScheduleExpression
            Enabled: true

Outputs:
  AuditorFunctionName:
    Value: !Ref ResourceAuditorFunction
  ReportsBucketName:
    Value: !Ref AuditReportsBucket
